<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SKAGATA PKL Intelligence - SMKN 3 Yogyakarta Vocational High School Internship Platform">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SKAGATA PKL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SKAGATA PKL Intelligence - SMKN 3 Yogyakarta</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b1c30;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #5bb8fe;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div style="font-weight: 700; letter-spacing: 0.5px; font-size: 16px;">SKAGATA PKL INTELLIGENCE</div>
    <div style="font-size: 12px; color: #94A3B8; margin-top: 4px;">SMKN 3 Yogyakarta</div>
  </div>

  <!-- Generated by tools/configure_maps.py from deployment environment. -->
  <script src="maps-config.js"></script>
  <script>
    (async function () {
      const key = window.GOOGLE_MAPS_API_KEY || '';
      if (key) {
        await new Promise(resolve => {
          const script = document.createElement('script');
          script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key);
          script.onload = resolve; script.onerror = resolve;
          document.head.appendChild(script);
        });
      }
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      document.body.appendChild(bootstrap);
    })();
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading-indicator')?.remove());
  </script>
</body>
</html>
